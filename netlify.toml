[build]
  command = "npm run build && cp -a dist/client/. dist/"
  publish = "dist/client"

[build.environment]
  NODE_VERSION = "20"

# Cache control headers — HTML never cached, assets cached forever
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"

# SPA fallback — lets TanStack Router handle client-side navigation
# for any path that doesn't match a prerendered file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
